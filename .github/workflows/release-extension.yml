name: release-extension

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build-macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build extractor
        run: cargo build --manifest-path eggplant-pattern-extractor/Cargo.toml --release --target ${{ matrix.target }}
      - name: Upload extractor
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: eggplant-pattern-extractor/target/${{ matrix.target }}/release/eggplant-pattern-extractor

  build-linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Build extractor
        run: cargo zigbuild --manifest-path eggplant-pattern-extractor/Cargo.toml --release --target ${{ matrix.target }}
      - name: Upload extractor
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: eggplant-pattern-extractor/target/${{ matrix.target }}/release/eggplant-pattern-extractor

  build-windows:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-xwin
        run: cargo install cargo-xwin --locked
      - name: Build extractor
        run: cargo xwin build --manifest-path eggplant-pattern-extractor/Cargo.toml --release --target ${{ matrix.target }}
      - name: Upload extractor
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: eggplant-pattern-extractor/target/${{ matrix.target }}/release/eggplant-pattern-extractor.exe

  package-vsix:
    needs:
      - build-macos
      - build-linux
      - build-windows
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: eggplant-pattern-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eggplant-pattern-vscode/package-lock.json
      - name: Download extractor artifacts
        uses: actions/download-artifact@v4
        with:
          path: eggplant-pattern-vscode/.artifacts
      - name: Install extension dependencies
        run: npm ci
      - name: Stage bundled binaries
        run: npm run stage:release-binaries -- ./.artifacts
      - name: Compile extension
        run: npm run compile
      - name: Override publisher for CI packaging
        if: ${{ vars.VSCE_PUBLISHER != '' }}
        run: npm pkg set publisher="${{ vars.VSCE_PUBLISHER }}"
      - name: Package VSIX
        run: npx @vscode/vsce package --out dist/eggplant-pattern-vscode.vsix
      - name: Publish to Marketplace
        if: ${{ github.event_name == 'release' && secrets.VSCE_PAT != '' && vars.VSCE_PUBLISHER != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath dist/eggplant-pattern-vscode.vsix
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: eggplant-pattern-vsix
          path: eggplant-pattern-vscode/dist/eggplant-pattern-vscode.vsix
